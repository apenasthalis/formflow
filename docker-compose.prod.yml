# ----------------------------------------------------------------------------
# FormFlow — override de produção.
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# O que muda em relação ao compose base:
#   - Nginx publica 443 (HTTPS no domínio) e 8080 (HTTP para acesso por IP).
#     O compose base só publica 80, então `!override` substitui a lista em vez de
#     somar a ela. A porta 80 pertence a outra aplicação desta VPS.
#   - Nginx recebe os certificados do certbot (/etc/letsencrypt) e o webroot do
#     desafio ACME (/var/www/certbot), montados somente-leitura.
#   - O backend sobe com COOKIE_SECURE=auto, que marca `Secure` só nas
#     requisições que chegam por TLS, preservando o login nas duas entradas.
# ----------------------------------------------------------------------------

services:
  nginx:
    ports: !override
      - '443:443'
      - '8080:8080'
    volumes:
      - ./nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Certificados gerados no host por `certbot certonly --webroot`.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Webroot do desafio ACME. O Nginx só o monta por causa do volume acima;
      # quem responde o desafio na 80 é a outra aplicação, apontando para o
      # mesmo caminho no host.
      - /opt/sources/certbot/www:/var/www/certbot:ro
    # `host.docker.internal` é o gateway do host, usado no bloco default_server
    # da 443 para encaminhar o acesso por IP à aplicação da porta 80.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # O healthcheck usa a 8080 porque é a única entrada HTTP sem redirect nem
    # TLS dentro do container.
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s