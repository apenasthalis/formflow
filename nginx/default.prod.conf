# Nginx — proxy reverso de produção do FormFlow.
# Substitui nginx/default.conf via `docker-compose.prod.yml`.
#
# O FormFlow responde em duas entradas:
#   - 443 : https://form.ralecram.com.br (TLS)
#   - 8080: http://<ip>:8080 (HTTP, acesso direto por IP)
#
# O domínio raiz, https://ralecram.com.br, não serve o FormFlow: fica
# reservado para a página principal e por enquanto responde 404. O redirecionamento
# acontece no cliente (HTTP -> HTTPS e www -> apex).
#
# A porta 80 pertence a outra aplicação desta VPS, que também é a responsável
# por responder o desafio ACME (certbot) em /.well-known/acme-challenge/ — por
# isso este arquivo não tem server block na 80.
#
# Os certificados são gerados no host por `certbot certonly --webroot` e
# montados somente-leitura em /etc/letsencrypt. São dois certificados:
#   - live/form.ralecram.com.br  -> subdomínio do FormFlow
#   - live/ralecram.com.br       -> raiz/www (404) e acesso por IP

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Limite de tamanho igual ao permitido pela API (256kb).
client_max_body_size 1m;

upstream formflow_api {
    server server:4000;
    keepalive 16;
}

upstream formflow_client {
    server client:5173;
    keepalive 16;
}

# --- Raiz e www: placeholder ---------------------------------------------------
# Reservados para a página principal do site. Respondem 404 até existirem.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ralecram.com.br www.ralecram.com.br;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/ralecram.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ralecram.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        return 404;
    }
}

# --- Acesso por IP (qualquer Host fora dos domínios) ---------------------------
# Chrome e Edge convertem http://<ip> para https://<ip>; sem este bloco a
# navegação por IP cairia no bloco do domínio e exibiria a aplicação errada.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/ralecram.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ralecram.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # O TLS termina aqui e o tráfego segue em texto puro para a aplicação da
    # porta 80. Como o certificado é do domínio, https://<ip> mostra um aviso de
    # nome — depois de aceitar uma vez a sessão funciona normalmente.
    location / {
        proxy_pass http://host.docker.internal:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 300s;
    }
}

# --- Subdomínio do FormFlow ----------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name form.ralecram.com.br;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/form.ralecram.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/form.ralecram.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # --- API -----------------------------------------------------------------
    location /api/ {
        proxy_pass http://formflow_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://formflow_api/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- Frontend ------------------------------------------------------------
    location / {
        proxy_pass http://formflow_client;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Build estático pode ser cacheado com segurança.
    location /assets/ {
        proxy_pass http://formflow_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

# --- Acesso direto por IP, sem TLS ----------------------------------------------
# Pensado para desenvolvimento e diagnóstico: é a mesma aplicação do subdomínio,
# com COOKIE_SECURE=auto cuidando do atributo Secure do cookie de sessão.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    server_tokens off;

    # --- API -----------------------------------------------------------------
    location /api/ {
        proxy_pass http://formflow_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://formflow_api/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- Frontend ------------------------------------------------------------
    location / {
        proxy_pass http://formflow_client;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Build estático pode ser cacheado com segurança.
    location /assets/ {
        proxy_pass http://formflow_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}