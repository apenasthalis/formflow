# Nginx — proxy reverso de produção (HTTPS na porta 8080).
# Substitui nginx/default.conf via `docker-compose.prod.yml`.
#
# A porta 80/443 pertence a outra aplicação desta VPS, então o FormFlow escuta
# apenas em 8080 com TLS. O certificado é gerado no host pelo certbot e montado
# em /etc/letsencrypt.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Limite de tamanho igual ao permitido pela API (256kb).
client_max_body_size 1m;

upstream formflow_api {
    server server:4000;
    keepalive 16;
}

upstream formflow_client {
    server client:5173;
    keepalive 16;
}

server {
    listen 8080 ssl;
    listen [::]:8080 ssl;
    server_name ralecram.com.br www.ralecram.com.br;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/ralecram.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ralecram.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # --- API -----------------------------------------------------------------
    location /api/ {
        proxy_pass http://formflow_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://formflow_api/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- Frontend ------------------------------------------------------------
    location / {
        proxy_pass http://formflow_client;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Build estático pode ser cacheado com segurança.
    location /assets/ {
        proxy_pass http://formflow_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}