# Nginx — proxy reverso local.
# http://localhost -> /api/* vai para o backend, o restante para o frontend.
# O mesmo arquivo serve para os modos de desenvolvimento e de produção (build).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Limite de tamanho igual ao permitido pela API (256kb).
client_max_body_size 1m;

upstream formflow_api {
    server server:4000;
    keepalive 16;
}

upstream formflow_client {
    server client:5173;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Não expor a versão do Nginx.
    server_tokens off;

    # --- API -----------------------------------------------------------------
    location /api/ {
        proxy_pass http://formflow_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://formflow_api/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- Frontend ------------------------------------------------------------
    # HMR do Vite usa WebSocket em /; o restante é SPA (fallback para index.html).
    location / {
        proxy_pass http://formflow_client;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Build estático pode ser cacheado com segurança.
    location /assets/ {
        proxy_pass http://formflow_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}